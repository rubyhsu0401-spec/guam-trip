async function open_(pw,silent){
  try{
    var k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(P.s),iterations:P.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(P.i)},k,u(P.c));
    try{localStorage.setItem('guam-pw',pw);}catch(e){}
    var html=new TextDecoder().decode(pt);
    var L='<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="關島旅伴"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=6"><link rel="icon" href="icon-192.png?v=6"><link rel="manifest" href="manifest.webmanifest?v=6">';
    html=html.replace(/<head>/i,'<head>'+L);
    document.open();document.write(html);document.close();
  }catch(e){
    try{localStorage.removeItem('guam-pw');}catch(x){}
    if(!silent)document.getElementById('err').textContent='密碼不對，請再試一次';
  }
}
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();open_(document.getElementById('pw').value,false);});
